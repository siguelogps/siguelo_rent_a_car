<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Empresas</title><link rel="icon" href="/img/logo-pin.png">
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/rentacar.css"><link rel="stylesheet" href="/css/config.css">
</head>
<body>
<main>
  <div class="pagina-cab">
    <div><h1>Empresas</h1><p>Rent a Car clientes de Síguelo · solo equipo Síguelo</p></div>
    <div class="acciones"><input class="campo" id="filtro" placeholder="Buscar por nombre, RUT o slug…" style="min-width:240px"><button class="btn primario" id="nueva">+ Nueva empresa</button></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tarjeta"><div class="tabla-env"><table class="tabla">
    <thead><tr><th>Empresa</th><th>Portal</th><th>Plan</th><th>Vehículos</th><th>Usuarios</th><th>Marcha blanca</th><th>Estado</th><th>Alta</th><th></th></tr></thead>
    <tbody id="lista"><tr><td colspan="9" class="rc-cargando">Cargando…</td></tr></tbody>
  </table></div></div>
</main>
<script type="module">
import { iniciarPagina, api, esc, fecha, rut, validarRut, modal, confirmar, toast, toastError, leerForm } from '/comun.js';
const yo = await iniciarPagina({ activo: 'empresas', titulo: 'Empresas' });
if (yo.usuario.rol !== 'superadmin') {
  document.querySelector('main').innerHTML = '<p class="aviso error">Solo el equipo de Síguelo puede administrar las empresas.</p>';
  throw new Error('sin permiso');
}
let LISTA = [];
const PLANES = ['basico', 'pro', 'empresa'];
const PLAN = { basico: 'Básico', pro: 'Pro', empresa: 'Empresa' };

async function cargar() {
  LISTA = await api('empresas');
  pintar();
}
function pintar() {
  const t = document.getElementById('filtro').value.trim().toLowerCase();
  const vis = LISTA.filter((e) => !t || [e.nombre, e.slug, e.rut, e.razon_social].some((x) => String(x || '').toLowerCase().includes(t)));
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><span>Empresas</span><b>${LISTA.length}</b><small>${LISTA.filter((e) => e.activa).length} activas</small></div>
    <div class="kpi"><span>Vehículos</span><b>${LISTA.reduce((s, e) => s + e.vehiculos, 0).toLocaleString('es-CL')}</b><small>en todas las empresas</small></div>
    <div class="kpi"><span>Usuarios</span><b>${LISTA.reduce((s, e) => s + e.usuarios, 0)}</b><small>de los rentacars</small></div>
    <div class="kpi"><span>En marcha blanca</span><b>${LISTA.filter((e) => e.marcha_blanca).length}</b><small>aún sin salidas reales</small></div>`;
  document.getElementById('lista').innerHTML = vis.map((e) => {
    const ini = e.nombre.split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();
    const actual = e.id === yo.empresa?.id;
    return `<tr><td><div class="rc-fila" style="flex-wrap:nowrap">${e.logo_clave ? `<img class="rc-empresa-logo" src="/api/logo/${esc(e.slug)}" alt="">` : `<span class="rc-empresa-logo" style="background:${esc(e.color || '#0F5F58')}">${esc(ini)}</span>`}
      <div><b>${esc(e.nombre)}</b>${actual ? ' <span class="chip marca">activa en tu sesión</span>' : ''}<div class="peq muted mono">${e.rut ? rut(e.rut) : 'sin RUT'}</div></div></div></td>
      <td style="white-space:nowrap"><a class="mono peq" href="/reservar/${esc(e.slug)}" target="_blank" rel="noopener">/reservar/${esc(e.slug)}</a></td>
      <td><select class="campo" data-plan="${e.id}" aria-label="Plan">${[...new Set([...PLANES, e.plan])].map((p) => `<option value="${esc(p)}"${p === e.plan ? ' selected' : ''}>${esc(PLAN[p] || p)}</option>`).join('')}</select></td>
      <td class="mono">${e.vehiculos}</td><td class="mono">${e.usuarios}</td>
      <td>${e.marcha_blanca ? '<span class="chip rc-marcha">● Activa</span>' : '<span class="chip ok">Operación real</span>'}</td>
      <td><label class="cf-switch-et"><span class="switch"><input type="checkbox" data-activa="${e.id}"${e.activa ? ' checked' : ''} aria-label="Empresa activa"><span></span></span><span>${e.activa ? 'Activa' : 'Suspendida'}</span></label></td>
      <td class="mono peq" style="white-space:nowrap">${fecha(e.creado_en)}</td>
      <td style="text-align:right"><button class="btn peq ${actual ? '' : 'primario'}" data-entrar="${e.id}">${actual ? 'Ir al inicio' : 'Entrar'}</button></td></tr>`;
  }).join('') || '<tr><td colspan="9" class="rc-vacio">Sin empresas</td></tr>';
}
document.getElementById('filtro').oninput = pintar;
document.getElementById('lista').addEventListener('click', async (ev) => {
  const b = ev.target.closest('[data-entrar]');
  if (!b) return;
  try { await api('empresa-activa', { body: { empresa_id: Number(b.dataset.entrar) } }); location.href = '/inicio'; } catch (e) { toastError(e); }
});
document.getElementById('lista').addEventListener('change', async (ev) => {
  const a = ev.target.closest('[data-activa]'), p = ev.target.closest('[data-plan]');
  try {
    if (a) {
      const e = LISTA.find((x) => x.id === Number(a.dataset.activa));
      if (!a.checked && !await confirmar('Suspender empresa', `<b>${esc(e.nombre)}</b> dejará de aparecer en el portal de reservas. Sus usuarios conservan sus datos.`, { boton: 'Suspender', peligro: true })) { a.checked = true; return; }
      await api(`configuracion/empresas/${e.id}`, { method: 'PATCH', body: { activa: a.checked } });
      toast(a.checked ? 'Empresa activada' : 'Empresa suspendida', 'ok'); cargar();
    }
    if (p) { await api(`configuracion/empresas/${p.dataset.plan}`, { method: 'PATCH', body: { plan: p.value } }); toast('Plan actualizado', 'ok'); cargar(); }
  } catch (e) { toastError(e); cargar(); }
});
const claveAzar = () => { const abc = 'abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789'; return Array.from(crypto.getRandomValues(new Uint8Array(10)), (x) => abc[x % abc.length]).join(''); };
document.getElementById('nueva').onclick = () => modal({ titulo: 'Nueva empresa (rentacar)', ancho: true, html: `
  <div class="cf-form">
    <label class="etiqueta">Nombre comercial<input class="campo" name="nombre" required placeholder="Patagonia Rent a Car"></label>
    <label class="etiqueta">Identificador del portal (slug)<input class="campo mono" name="slug" placeholder="se genera desde el nombre"></label>
    <label class="etiqueta">RUT<input class="campo" name="rut" placeholder="76.123.456-7"></label>
    <label class="etiqueta">Razón social<input class="campo" name="razon_social"></label>
    <label class="etiqueta">Dirección<input class="campo" name="direccion"></label>
    <label class="etiqueta">Comuna<input class="campo" name="comuna"></label>
    <label class="etiqueta">Ciudad<input class="campo" name="ciudad"></label>
    <label class="etiqueta">Teléfono<input class="campo" name="telefono"></label>
    <label class="etiqueta">Correo de contacto<input class="campo" type="email" name="correo"></label>
    <label class="etiqueta">Primera sucursal<input class="campo" name="sucursal" placeholder="Casa matriz"></label>
  </div>
  <h3 style="font-size:14px">Administrador inicial</h3>
  <div class="cf-form">
    <label class="etiqueta">Nombre<input class="campo" name="admin_nombre" required></label>
    <label class="etiqueta">Correo<input class="campo" type="email" name="admin_correo" required></label>
    <label class="etiqueta">Clave temporal<input class="campo mono" name="admin_clave" value="${claveAzar()}" required></label>
  </div>
  <p class="cf-ayuda">La empresa parte en <b>marcha blanca</b>, con las plantillas por defecto y sin integraciones activas.</p>`,
botones: [{ texto: 'Cancelar' }, { texto: 'Crear empresa', clase: 'primario', accion: async (c) => {
  const d = leerForm(c);
  if (d.rut && !validarRut(d.rut)) throw new Error('El RUT de la empresa no es válido');
  if ((d.admin_clave || '').length < 10) throw new Error('La clave del administrador debe tener al menos 10 caracteres');
  const e = await api('empresas', { body: d });
  toast(`${e.nombre} creada · portal /reservar/${e.slug}`, 'ok');
  setTimeout(() => modal({ titulo: 'Empresa creada', html: `<p>Entrega estos datos al administrador de <b>${esc(e.nombre)}</b>:</p><div class="cf-clave" style="font-size:15px;text-align:left">Correo: ${esc(d.admin_correo)}<br>Clave temporal: ${esc(d.admin_clave)}</div><p class="peq muted">Puede cambiar la clave en Configuración › Mi clave.</p>` }), 50);
  cargar();
} }] });
cargar().catch(toastError);
</script>
</body>
</html>
