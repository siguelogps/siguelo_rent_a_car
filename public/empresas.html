<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clientes</title><link rel="icon" href="/img/logo-pin.png">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png"><meta name="theme-color" content="#FFFFFF">
<script src="/tema.js"></script><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/rentacar.css"><link rel="stylesheet" href="/css/config.css"><link rel="stylesheet" href="/css/backoffice.css">
</head>
<body>
<main>
  <div class="pagina-cab">
    <div><h1>Clientes de Síguelo On Rent</h1><p>Altas, planes, integraciones y estado de cada rentacar. Todo cambio queda en la bitácora.</p></div>
    <div class="acciones"><a class="btn primario" href="/empresa-nueva" id="nueva">+ Nuevo cliente</a></div>
  </div>
  <div class="kpis" id="kpis"></div>
  <div class="tarjeta">
    <div class="bo-filtros" id="filtros"></div>
    <div class="tabla-env"><table class="tabla">
      <thead><tr><th>Cliente</th><th>Estado</th><th>Plan y módulos</th><th>Vehículos</th><th>Usuarios</th><th>Integraciones</th><th>Última actividad</th><th></th></tr></thead>
      <tbody id="lista"><tr><td colspan="8" class="rc-cargando">Cargando…</td></tr></tbody>
    </table></div>
    <div class="bo-leyenda" id="leyenda"></div>
  </div>
</main>
<script type="module">
// Backoffice Síguelo · lista de clientes (22-oct, espec. aprobada por Pablo, mockup 01-clientes).
import { iniciarPagina, api, esc, fecha, hora, rut, modal, toastError } from '/comun.js';
const yo = await iniciarPagina({ activo: 'empresas', titulo: 'Clientes' });
const LETRA = { gps: 'G', simpleapi: 'F', correo: 'C', whatsapp: 'W', dashboard_siguelo: 'O' };
const NOMBRE_SALUD = { ok: 'funciona', esp: 'en preparación', mal: 'falla', no: 'no contratada' };
const F = { estado: 'todos', plan: '', integ: '', texto: '' };
let D = { clientes: [], tipos: [] };
if (!yo.puede_operar) document.getElementById('nueva').hidden = true;

const iniciales = (n) => n.split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase();
const cuando = (v) => {
  if (!v) return '—';
  const d = Math.round((Date.parse(new Date().toISOString().slice(0, 10)) - Date.parse(new Date(v).toISOString().slice(0, 10))) / 864e5);
  return d === 0 ? `hoy ${hora(v)}` : d === 1 ? `ayer ${hora(v)}` : fecha(v);
};
const estadoDe = (e) => (e.estado === 'activo' && e.marcha_blanca ? 'marcha' : e.estado);
function chipEstado(e) {
  if (e.estado === 'suspendido') return `<span class="chip susp">Suspendido</span><div class="peq muted">${esc(e.estado_motivo || '')}${e.estado_en ? ` · ${fecha(e.estado_en)}` : ''}</div>`;
  if (e.estado === 'baja') return `<span class="chip bajac">Baja</span><div class="peq muted">exportar hasta ${fecha(e.exportar_hasta)}</div>`;
  return e.marcha_blanca ? '<span class="chip mb">Marcha blanca</span>' : '<span class="chip ok">Activo</span>';
}

async function cargar() {
  D = await api('backoffice/clientes');
  pintar();
}
function pintar() {
  const L = D.clientes;
  const n = (f) => L.filter(f).length;
  const conFalla = n((e) => Object.values(e.salud).includes('mal'));
  const solicitudes = L.reduce((s, e) => s + e.solicitudes, 0);
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><span>Activos</span><b>${n((e) => e.estado === 'activo')}</b><small>de ${L.length} clientes</small></div>
    <div class="kpi"><span>En marcha blanca</span><b>${n((e) => e.estado === 'activo' && e.marcha_blanca)}</b><small>sin mensajes reales todavía</small></div>
    <div class="kpi"><span>Suspendidos</span><b>${n((e) => e.estado === 'suspendido')}</b><small>sin acceso a la herramienta</small></div>
    <div class="kpi"><span>Integraciones con falla</span><b class="${conFalla ? 'mal' : ''}">${conFalla}</b><small class="${conFalla ? 'mal' : ''}">última prueba con error</small></div>
    <div class="kpi"><span>Solicitudes pendientes</span><b>${solicitudes}</b><small><a href="/solicitudes">ver la bandeja</a></small></div>`;
  const planes = [...new Map(L.map((e) => [e.plan, e.plan_nombre || e.plan])).entries()];
  const filtro = (k, t, c) => `<button type="button" class="filtro" data-estado="${k}" aria-pressed="${F.estado === k}">${t} <span class="n">${c}</span></button>`;
  document.getElementById('filtros').innerHTML = `
    <label class="buscar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="f-texto" type="search" placeholder="Nombre, RUT o portal" value="${esc(F.texto)}"></label>
    ${filtro('todos', 'Todos', L.length)}${filtro('activo', 'Activos', n((e) => e.estado === 'activo' && !e.marcha_blanca))}${filtro('marcha', 'Marcha blanca', n((e) => estadoDe(e) === 'marcha'))}${filtro('suspendido', 'Suspendidos', n((e) => e.estado === 'suspendido'))}${filtro('baja', 'Baja', n((e) => e.estado === 'baja'))}
    <select class="campo" id="f-plan" aria-label="Plan"><option value="">Todos los planes</option>${planes.map(([c, t]) => `<option value="${esc(c)}"${F.plan === c ? ' selected' : ''}>${esc(t)}</option>`).join('')}</select>
    <select class="campo" id="f-integ" aria-label="Integraciones"><option value="">Integraciones: todas</option><option value="mal"${F.integ === 'mal' ? ' selected' : ''}>Con falla</option><option value="esp"${F.integ === 'esp' ? ' selected' : ''}>En preparación</option></select>`;
  const t = F.texto.toLowerCase().replace(/[.\-\s]/g, '');
  const vis = L.filter((e) => (F.estado === 'todos' || (F.estado === 'activo' ? e.estado === 'activo' && !e.marcha_blanca : estadoDe(e) === F.estado))
    && (!F.plan || e.plan === F.plan) && (!F.integ || Object.values(e.salud).includes(F.integ))
    && (!t || [e.nombre, e.razon_social, e.rut, e.slug].some((x) => String(x || '').toLowerCase().replace(/[.\-\s]/g, '').includes(t))));
  document.getElementById('lista').innerHTML = vis.map((e) => {
    const apagado = e.estado !== 'activo';
    return `<tr class="${apagado ? 'bo-apagada' : ''}">
      <td><a class="bo-cli" href="/empresas/${e.id}">${e.logo_clave ? `<img class="rc-empresa-logo" src="/api/logo/${esc(e.slug)}" alt="">` : `<span class="rc-empresa-logo" style="background:${esc(e.color || '#0F5F58')}">${esc(iniciales(e.nombre))}</span>`}
        <span><b>${esc(e.nombre)}</b><small>${e.rut ? rut(e.rut) : 'sin RUT'} · desde ${fecha(e.creado_en)}</small></span></a></td>
      <td>${chipEstado(e)}</td>
      <td><span class="chip">${esc(e.plan_nombre || e.plan)}</span>${(e.modulos_extra || []).includes('app_propia') ? ' <span class="chip marca">App con marca</span>' : ''}</td>
      <td class="mono">${e.vehiculos}</td><td class="mono">${e.usuarios}</td>
      <td><span class="bo-salud">${D.tipos.map((x) => `<i class="${e.salud[x.tipo]}" title="${esc(x.nombre)}: ${NOMBRE_SALUD[e.salud[x.tipo]]}">${LETRA[x.tipo] || '?'}</i>`).join('')}</span></td>
      <td class="mono peq" style="white-space:nowrap">${cuando(e.ultima_actividad)}</td>
      <td><div class="bo-acc"><button class="btn peq" data-ver="${e.id}">Ver como</button><button class="btn peq" data-operar="${e.id}"${apagado || !yo.puede_operar ? ' disabled title="A un cliente suspendido o dado de baja solo se puede «Ver como»"' : ''}>Operar</button><a class="btn peq primario" href="/empresas/${e.id}">Abrir</a></div></td></tr>`;
  }).join('') || '<tr><td colspan="8" class="rc-vacio">Sin clientes con estos filtros</td></tr>';
  document.getElementById('leyenda').innerHTML = `<span class="mono">${vis.length} de ${L.length}</span>
    ${D.tipos.map((x) => `<span><b class="mono">${LETRA[x.tipo]}</b> ${esc(x.nombre)}</span>`).join('')}
    <span style="margin-left:auto"><span class="bo-salud"><i class="ok">✓</i></span> funciona</span><span><span class="bo-salud"><i class="esp">…</i></span> en preparación</span><span><span class="bo-salud"><i class="mal">!</i></span> falla</span><span><span class="bo-salud"><i class="no">–</i></span> no contratada</span>`;
}

const main = document.querySelector('main');
main.addEventListener('click', async (ev) => {
  const f = ev.target.closest('[data-estado]');
  if (f) { F.estado = f.dataset.estado; return pintar(); }
  const v = ev.target.closest('[data-ver]');
  if (v) { try { const r = await api(`backoffice/clientes/${v.dataset.ver}/entrar`, { body: { modo: 'ver' } }); location.href = r.destino; } catch (e) { toastError(e); } return; }
  const o = ev.target.closest('[data-operar]');
  if (o) {
    const c = D.clientes.find((x) => x.id === Number(o.dataset.operar));
    modal({ titulo: `Operar en ${c.nombre}`, html: `<p class="peq muted">Actúas como administrador del cliente. La franja amarilla queda arriba todo el rato y cada cambio va a la bitácora del cliente con tu nombre y este motivo.</p>
      <label class="etiqueta">Motivo<input class="campo" name="motivo" placeholder="Soporte, ticket 1187" maxlength="300"></label>`,
    botones: [{ texto: 'Cancelar' }, { texto: 'Operar', clase: 'contorno', accion: async (cu) => { const r = await api(`backoffice/clientes/${c.id}/entrar`, { body: { modo: 'operar', motivo: cu.querySelector('[name=motivo]').value } }); location.href = r.destino; } }] });
  }
});
main.addEventListener('input', (ev) => { if (ev.target.id === 'f-texto') { F.texto = ev.target.value; const pos = ev.target.selectionStart; pintar(); const i = document.getElementById('f-texto'); i.focus(); i.setSelectionRange(pos, pos); } });
main.addEventListener('change', (ev) => { if (ev.target.id === 'f-plan') { F.plan = ev.target.value; pintar(); } if (ev.target.id === 'f-integ') { F.integ = ev.target.value; pintar(); } });
cargar().catch(toastError);
</script>
</body>
</html>
