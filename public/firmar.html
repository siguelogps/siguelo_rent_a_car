<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Firma de contrato</title><link rel="icon" href="/img/logo-pin.png">
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/rentacar.css"><link rel="stylesheet" href="/css/reservas.css">
</head>
<body>
<div class="rs-publico">
  <header class="rs-pub-cab" id="cab"><img src="/img/logo-pin.png" alt="" style="height:30px"><div><b>Firma de contrato</b></div></header>
  <div class="rs-pub-cuerpo" id="cuerpo"><p class="rc-cargando">Cargando contrato…</p></div>
  <footer class="rs-pub-pie"><span>Firma electrónica con</span><img src="/img/logo-siguelo.png" alt="Síguelo GPS"><span>Rentacar</span></footer>
</div>
<script type="module">
import { esc, fecha, hora } from '/comun.js';
import { crearFirma } from '/firma.js';

const token = location.pathname.split('/').pop();
const volver = (() => { const v = new URLSearchParams(location.search).get('volver'); return v && /^\/[a-z]/.test(v) && !v.startsWith('//') ? v : null; })();
const cuerpo = document.getElementById('cuerpo'), cab = document.getElementById('cab');
const fh = (v) => (v ? `${fecha(v)} ${hora(v)}` : '');

async function pedir(metodo = 'GET', body) {
  const r = await fetch(`/api/firmar/${encodeURIComponent(token)}`, { method: metodo, headers: body ? { 'Content-Type': 'application/json' } : {}, body: body ? JSON.stringify(body) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw Object.assign(new Error(j.error || 'No se pudo cargar el contrato'), { estado: r.status, campo: j.campo });
  return j;
}

function cabecera(c) {
  const e = c.empresa;
  cab.innerHTML = `${e.logo ? `<img class="logo-e" src="${esc(e.logo)}" alt="${esc(e.nombre)}">` : `<span class="marca-e" style="background:${esc(e.color || '#0F5F58')}">${esc(e.nombre.split(/\s+/).map((p) => p[0]).slice(0, 2).join('').toUpperCase())}</span>`}
    <div><b>${esc(e.nombre)}</b><small>Contrato de arriendo <span class="mono">${esc(c.folio)}</span></small></div>`;
  document.title = `Firma del contrato ${c.folio} · ${e.nombre}`;
}

function listo(c, recien) {
  cuerpo.innerHTML = `<div class="tarjeta bloque rs-verif">
    <div class="rs-ok-grande">✓</div>
    <h1>${recien ? '¡Contrato firmado!' : 'Este contrato ya está firmado'}</h1>
    <p class="muted">${esc(c.firmante_nombre || '')} firmó el contrato <b class="mono">${esc(c.folio)}</b> el ${fh(c.firmado_en)}.${recien ? ' Te enviaremos una copia en PDF por correo y WhatsApp.' : ''}</p>
    ${c.codigo_verificacion ? `<p>Código de verificación <b class="mono">${esc(c.codigo_verificacion)}</b></p>` : ''}
    <div class="rc-fila" style="justify-content:center">
      <a class="btn primario grande" href="/api/firmar/${encodeURIComponent(token)}/pdf">Descargar copia (PDF)</a>
      ${c.url_verificacion ? `<a class="btn grande" href="${esc(new URL(c.url_verificacion).pathname)}">Ver verificación</a>` : ''}
      ${volver ? `<a class="btn oscuro grande" href="${esc(volver)}">Volver a la reserva</a>` : ''}
    </div></div>`;
}

function error(msg) {
  cuerpo.innerHTML = `<div class="tarjeta bloque rs-verif"><div class="rs-ok-grande rs-mal-grande">!</div><h1>No se puede firmar</h1><p class="muted">${esc(msg)}</p>${volver ? `<a class="btn" href="${esc(volver)}">Volver</a>` : ''}</div>`;
}

let c = null;
try { c = await pedir(); } catch (e) { error(e.message); }
if (c) {
  cabecera(c);
  if (c.estado === 'firmado') listo(c, false);
  else {
    cuerpo.innerHTML = `
      <div class="tarjeta pad"><div class="rc-entre" style="flex-wrap:wrap;gap:10px">
        <div><span class="muted peq">Arrendatario</span><div><b>${esc(c.cliente)}</b></div></div>
        <div><span class="muted peq">Vehículo</span><div>${c.patente ? `<span class="pat">${esc(c.patente)}</span> ` : ''}${esc(c.vehiculo)}</div></div>
        <div><span class="muted peq">Período</span><div class="mono">${fh(c.inicio)} → ${fh(c.fin)}</div></div>
      </div></div>
      <div><h2 style="font-size:16px;margin-bottom:8px">Lee el contrato</h2><div class="rs-firma-texto" tabindex="0">${esc(c.contenido)}</div></div>
      <form class="tarjeta bloque" id="f" novalidate>
        <h2>Tus datos y firma</h2>
        <div class="campos">
          <label style="flex:2 1 240px">Nombre completo<input class="campo" name="nombre" value="${esc(c.cliente)}" autocomplete="name" required></label>
          <label style="flex:1 1 170px">RUT, pasaporte o DNI<input class="campo mono" name="documento" value="${esc(c.documento)}" required></label>
        </div>
        <label class="rs-acepto"><input type="checkbox" name="acepta"><span>Leí y acepto las condiciones del contrato de arriendo <b class="mono">${esc(c.folio)}</b>, incluido el cobro de TAG, multas, combustible y daños hasta el deducible.</span></label>
        <div><div class="rc-entre"><b class="peq">Firma</b><small class="muted">Usa el dedo, un lápiz o el mouse</small></div><div id="firma" style="margin-top:6px"></div></div>
        <div class="aviso error" id="err" hidden></div>
        <button class="btn primario grande" type="submit" id="enviar">Firmar contrato</button>
        <p class="peq muted">Al firmar se registran la fecha y hora, tu dirección IP y el dispositivo. El contrato queda validado con un código QR.</p>
      </form>`;
    const firma = crearFirma(document.getElementById('firma'), { alto: 200 });
    const f = document.getElementById('f'), err = document.getElementById('err'), btn = document.getElementById('enviar');
    f.onsubmit = async (ev) => {
      ev.preventDefault();
      err.hidden = true;
      const nombre = f.nombre.value.trim(), documento = f.documento.value.trim();
      const falta = nombre.length < 3 ? 'Escribe tu nombre completo' : documento.length < 5 ? 'Escribe tu RUT, pasaporte o DNI' : !f.acepta.checked ? 'Debes aceptar las condiciones del contrato' : firma.vacia() ? 'Falta tu firma en el recuadro' : null;
      if (falta) { err.textContent = falta; err.hidden = false; return; }
      btn.disabled = true; btn.textContent = 'Firmando…';
      try {
        const r = await pedir('POST', { nombre, documento, acepta: true, firma: firma.dataUrl() });
        listo({ ...c, ...r, firmante_nombre: nombre }, true);
        window.scrollTo(0, 0);
      } catch (e) { err.textContent = e.message; err.hidden = false; btn.disabled = false; btn.textContent = 'Firmar contrato'; }
    };
  }
}
</script>
</body>
</html>
