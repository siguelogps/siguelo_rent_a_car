<!doctype html>
<html lang="es-CL">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Iniciar sesión · Síguelo On Rent</title>
<link rel="icon" href="/img/logo-pin.png">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" href="/img/app/apple-touch-icon.png"><meta name="theme-color" content="#FFFFFF">
<link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/rentacar.css">
</head>
<body>
<div class="login">
  <form class="caja" id="f">
    <img src="/img/logo-siguelo.png" alt="Síguelo GPS" id="logo" style="height:36px;max-width:220px;object-fit:contain;align-self:flex-start">
    <script>/* app con marca: ocultar el logo Síguelo antes del primer pintado (el módulo pone el de la empresa) */
      try { if (/[?&]app=/.test(location.search) || (window.Capacitor && localStorage.getItem('rc_app_empresa'))) document.getElementById('logo').style.visibility = 'hidden'; } catch (e) { /* sin almacenamiento */ }</script>
    <div><h1 style="font-size:20px" id="titulo">On Rent</h1><p class="muted peq" id="bajada">Administración de arriendo de vehículos</p></div>
    <label class="etiqueta">Correo<input class="campo" name="correo" type="email" autocomplete="username" required></label>
    <label class="etiqueta">Clave<input class="campo" name="clave" type="password" autocomplete="current-password" required></label>
    <div class="aviso error" id="err" hidden></div>
    <button class="btn primario grande" type="submit">Ingresar</button>
    <div class="aviso ok" id="eliminada" hidden>Tu cuenta fue eliminada. Gracias por usar Síguelo On Rent.</div>
    <p class="peq muted">¿Problemas para ingresar? Escribe a soporte@siguelogps.cl · <a href="/privacidad">Privacidad</a></p>
  </form>
</div>
<script type="module">
import { api, esNativa } from '/comun.js';
const f = document.getElementById('f'), err = document.getElementById('err');
// App con la marca de un cliente: la app abre /ingresar?app=<slug>; dentro de la app se recuerda para los siguientes ingresos.
const appEmpresa = (() => {
  const p = new URLSearchParams(location.search).get('app');
  try { if (p && esNativa()) localStorage.setItem('rc_app_empresa', p); return p || (esNativa() ? localStorage.getItem('rc_app_empresa') : null); } catch { return p; }
})();
// La marca queda guardada en el teléfono: desde el segundo ingreso se pinta al instante (sin destello del logo Síguelo).
function pintarMarca(m) {
  if (m.logo) document.getElementById('logo').src = m.logo;
  document.getElementById('titulo').textContent = m.nombres?.equipo || m.empresa;
  document.getElementById('bajada').textContent = `${m.empresa} · con tecnología Síguelo On Rent`;
  document.title = `Iniciar sesión · ${m.nombres?.equipo || m.empresa}`;
  if (m.color) document.querySelector('meta[name="theme-color"]')?.setAttribute('content', m.color);
  document.getElementById('logo').style.visibility = '';
}
if (appEmpresa) {
  let guardada = null;
  try { guardada = JSON.parse(localStorage.getItem(`rc_app_marca:${appEmpresa}`) || 'null'); } catch { /* sin almacenamiento */ }
  if (guardada) pintarMarca(guardada); else document.getElementById('logo').style.visibility = 'hidden';
  api(`apps/marca/${encodeURIComponent(appEmpresa)}`).then((m) => {
    pintarMarca(m);
    try { localStorage.setItem(`rc_app_marca:${appEmpresa}`, JSON.stringify(m)); } catch { /* sin almacenamiento */ }
  }).catch(() => { document.getElementById('logo').style.visibility = ''; });
}
if (new URLSearchParams(location.search).get('cuenta') === 'eliminada') document.getElementById('eliminada').hidden = false;
f.onsubmit = async (e) => {
  e.preventDefault();
  err.hidden = true;
  try {
    const r = await api('ingresar', { body: { correo: f.correo.value, clave: f.clave.value, app: appEmpresa || undefined } });
    const volver = new URLSearchParams(location.search).get('volver');
    location.href = volver && volver.startsWith('/') && !volver.startsWith('//') ? volver : r.destino;
  } catch (e2) { err.textContent = e2.message; err.hidden = false; }
};
</script>
</body>
</html>
