# Blueprint de Render: servicio web (Docker) + PostgreSQL administrado.
# Para migrar a otro cloud basta con la misma imagen Docker y una DATABASE_URL de PostgreSQL.
services:
  - type: web
    name: siguelo-rentacar
    runtime: docker
    plan: starter
    region: oregon
    healthCheckPath: /salud
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: siguelo-rentacar-db
          property: connectionString
      - key: APP_SECRET
        generateValue: true
      - key: SEMBRAR_DEMO
        value: "1"
      - key: DEMO_CLAVE
        generateValue: true
      - key: PERMITIR_ALMACENAMIENTO_BD
        value: "1"
databases:
  - name: siguelo-rentacar-db
    plan: basic-256mb
    region: oregon
    databaseName: rentacar
    postgresMajorVersion: "16"
